# Builds standalone binaries with PyInstaller. On a `v*` tag, the binaries are
# attached to a GitHub release for that tag.
name: Build binaries

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: .exe }
          - { os: ubuntu-24.04, name: linux-x64, ext: "" }
          - { os: ubuntu-24.04-arm, name: linux-arm64, ext: "" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - run: pip install . pyinstaller

      - name: Build
        # dnspython (used by mcstatus for SRV lookups) imports its record
        # types dynamically, so PyInstaller has to be told to include them.
        run: |
          pyinstaller --onefile --console --clean \
            --name "moneymod-lite-${{ matrix.name }}" \
            --collect-submodules dns \
            src/moneymod_lite/__main__.py

      - name: Smoke test
        # Ping a port with nothing on it: this exercises the whole program,
        # including the DNS lookup, and should report the server as down.
        run: |
          bin="dist/moneymod-lite-${{ matrix.name }}${{ matrix.ext }}"
          "$bin" --version
          set +e
          out=$("$bin" --once --no-color --no-queue --host 127.0.0.1:1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ]
          echo "$out" | grep -q "нет ответа"

      - uses: actions/upload-artifact@v7
        with:
          name: moneymod-lite-${{ matrix.name }}
          path: dist/moneymod-lite-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Moneymod Lite $GITHUB_REF_NAME" \
            --generate-notes
